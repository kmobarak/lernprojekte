<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IS-U Objektkarte</title>
<style>
  /* ---------- Design tokens (light + dark) ---------- */
  :root {
    --bg: #eef1f5; --surface: #ffffff; --map: #f7f9fc; --grid: #d0d8e3;
    --text: #17202b; --muted: #5c6a7a; --border: #d8dfe8; --chip: #eef2f7; --hit: #fff1b8;
    --c-sales: #6d4fd1; --c-place: #0f9d7a; --c-device: #dd7a1c; --c-edm: #1f6fe0; --c-market: #c63a78;
    --on-accent: #ffffff; --flow-dot: #ffffff;
    --chk-bg: #fdf0d8; --chk-fg: #8a5a00;
    --good: #1c8a4a; --good-bg: #e3f4ea; --bad: #c8372d; --bad-bg: #fbe4e1;
    --node-shadow: drop-shadow(0 2px 3px rgba(23, 32, 43, .14));
    --node-shadow-hover: drop-shadow(0 8px 12px rgba(23, 32, 43, .20));
    --font-display: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    --font-body: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --font-mono: "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1118; --surface: #141c27; --map: #0e151e; --grid: #1f2b3b;
      --text: #e7edf4; --muted: #92a1b3; --border: #253246; --chip: #1c2735; --hit: #4a4220;
      --c-sales: #9c84f5; --c-place: #3fd0a8; --c-device: #ffa24d; --c-edm: #5aa2ff; --c-market: #f472a8;
      --on-accent: #0b1118; --flow-dot: #0b1118;
      --chk-bg: #3d3018; --chk-fg: #f3c56f;
      --good: #5fd394; --good-bg: #1d3a2a; --bad: #f07a6e; --bad-bg: #45201c;
      --node-shadow: drop-shadow(0 2px 4px rgba(0, 0, 0, .55));
      --node-shadow-hover: drop-shadow(0 8px 14px rgba(0, 0, 0, .7));
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1118; --surface: #141c27; --map: #0e151e; --grid: #1f2b3b;
    --text: #e7edf4; --muted: #92a1b3; --border: #253246; --chip: #1c2735; --hit: #4a4220;
    --c-sales: #9c84f5; --c-place: #3fd0a8; --c-device: #ffa24d; --c-edm: #5aa2ff; --c-market: #f472a8;
    --on-accent: #0b1118; --flow-dot: #0b1118;
    --chk-bg: #3d3018; --chk-fg: #f3c56f;
    --good: #5fd394; --good-bg: #1d3a2a; --bad: #f07a6e; --bad-bg: #45201c;
    --node-shadow: drop-shadow(0 2px 4px rgba(0, 0, 0, .55));
    --node-shadow-hover: drop-shadow(0 8px 14px rgba(0, 0, 0, .7));
  }

  /* ---------- Page layout ---------- */
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); }
  header, main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  header { padding-bottom: 0; }
  .back { display: inline-block; margin-bottom: 8px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--c-edm); }
  .title { display: flex; align-items: center; gap: 12px; }
  .mark { width: 38px; height: 24px; flex-shrink: 0; fill: none; stroke: var(--c-edm);
          stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0; font: 600 30px/1.1 var(--font-display); letter-spacing: .01em; }
  .sub { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .toolbar input { flex: 1 1 260px; max-width: 400px; padding: 9px 14px; font: inherit;
                   color: var(--text); background: var(--surface);
                   border: 1px solid var(--border); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  .toolbar input:focus { outline: none; border-color: var(--c-edm); box-shadow: 0 0 0 3px rgba(31, 111, 224, .18); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex-basis: 100%; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 10px; cursor: pointer;
          font: 13px var(--font-body); color: var(--muted); background: var(--surface);
          border: 1px solid var(--border); border-radius: 999px; transition: border-color .15s, color .15s, box-shadow .15s; }
  .chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  .chip:hover { border-color: var(--dot); color: var(--text); }
  .chip.on { border-color: var(--dot); color: var(--text); box-shadow: inset 0 0 0 1px var(--dot); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  /* dot grid behind the diagram, like a technical drawing */
  .map { padding: 8px; overflow: hidden; background-color: var(--map);
         background-image: radial-gradient(var(--grid) 1.1px, transparent 1.3px); background-size: 20px 20px; }
  .panel { padding: 18px 20px; align-self: start; position: sticky; top: 16px; }
  @media (max-width: 960px) {
    .panel { position: static; }
    body.quizzing .panel { order: -1; }   /* narrow screens: question above the map */
  }

  /* ---------- Diagram: nodes ---------- */
  svg { display: block; width: 100%; height: auto; }
  .node { cursor: pointer; transform-box: fill-box; transform-origin: center; filter: var(--node-shadow);
          transition: opacity .25s, transform .2s cubic-bezier(.2, .8, .2, 1), filter .2s;
          animation: nodeIn .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i) * 40ms); }
  .node .card-bg { fill: var(--surface); stroke: var(--border); stroke-width: 1; transition: stroke .2s, stroke-width .2s, fill .2s; }
  .node .badge-bg { fill: var(--cat); }
  .node .icon { fill: none; stroke: var(--on-accent); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .node .name { fill: var(--text); font: 600 15px var(--font-display); letter-spacing: .01em; }
  .node .en { fill: var(--muted); font: 11.5px var(--font-body); }
  .node:hover, .node:focus-visible { transform: translateY(-3px); filter: var(--node-shadow-hover); }
  .node:hover .card-bg, .node:focus-visible .card-bg { stroke: var(--cat); stroke-width: 1.5; }
  .node:focus { outline: none; }
  .node.sel { filter: drop-shadow(0 0 9px var(--cat)); }
  .node.sel .card-bg { stroke: var(--cat); stroke-width: 2.5; }
  .node.hit .card-bg { fill: var(--hit); stroke: var(--cat); stroke-width: 2; }
  .node.dim { opacity: .18; filter: none; }
  @keyframes nodeIn { from { opacity: 0; transform: translateY(12px) scale(.94); } }

  /* ---------- Diagram: connections ---------- */
  .edge { cursor: pointer; transition: opacity .25s;
          animation: fadeIn .5s ease backwards; animation-delay: calc(450ms + var(--i) * 25ms); }
  .edge .wire { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .55; transition: opacity .2s, stroke-width .2s; }
  .edge:hover .wire { opacity: .9; }
  .edge.on .wire { opacity: 1; stroke-width: 3.2; }
  .edge.chk .wire { stroke-dasharray: 6 5; }
  .edge .hitarea { fill: none; stroke: transparent; stroke-width: 16; }
  /* dots travelling along an active connection, from source to target */
  .edge .flow { fill: none; stroke: var(--flow-dot); stroke-width: 1.6; stroke-linecap: round;
                stroke-dasharray: 1 13; opacity: 0; }
  .edge.on .flow { opacity: .95; animation: flow .7s linear infinite; }
  .edge .pill { fill: var(--surface); stroke: var(--border); stroke-width: 1; transition: stroke .2s; }
  .edge:hover .pill, .edge.on .pill { stroke: var(--muted); }
  .edge .tbl { fill: var(--text); font: 600 10.5px var(--font-mono); }
  .edge .qmark { display: none; fill: var(--muted); font: 600 11px var(--font-mono); }
  .edge .verb { fill: var(--muted); font: 10.5px var(--font-body); opacity: 0; transition: opacity .2s;
                paint-order: stroke; stroke: var(--map); stroke-width: 4px; stroke-linejoin: round; }
  .edge:hover .verb, .edge.on .verb { opacity: 1; }
  .edge.dim { opacity: .12; }
  @keyframes flow { to { stroke-dashoffset: -14; } }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Detail panel ---------- */
  .panel > * { animation: panelIn .3s ease backwards; }
  .panel > *:nth-child(2) { animation-delay: 30ms; }
  .panel > *:nth-child(3) { animation-delay: 60ms; }
  .panel > *:nth-child(4) { animation-delay: 90ms; }
  .panel > *:nth-child(n+5) { animation-delay: 120ms; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } }
  .cat-chip { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 2px 10px 2px 8px;
              border: 1px solid var(--cat); border-radius: 999px; color: var(--cat); font-size: 12px; font-weight: 600; }
  .cat-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .panel h2 { margin: 0; font: 600 23px/1.2 var(--font-display); letter-spacing: .01em; }
  .panel h3 { margin: 20px 0 6px; font: 600 12px var(--font-display); text-transform: uppercase;
              letter-spacing: .08em; color: var(--muted); }
  .panel p { margin: 6px 0; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { margin: 5px 0; }
  .en-label { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row .k { flex: 0 0 38%; }
  code { font-family: var(--font-mono); font-weight: 600; font-size: .92em; background: var(--chip);
         padding: 1px 6px; border-radius: 5px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .badge { margin-left: auto; flex-shrink: 0; font-size: 11px; padding: 1px 7px; border-radius: 10px;
           white-space: nowrap; background: var(--chk-bg); color: var(--chk-fg); }
  .rel { display: block; width: calc(100% + 12px); margin: 0 -6px; padding: 8px 6px; text-align: left; font: inherit;
         color: var(--text); background: none; border: 0; border-top: 1px solid var(--border);
         cursor: pointer; transition: background .15s; }
  .rel:hover { background: var(--chip); }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---------- Buttons ---------- */
  .btn { font: 600 14px var(--font-display); letter-spacing: .02em; padding: 8px 16px; border-radius: 10px; cursor: pointer;
         border: 1px solid var(--c-edm); background: var(--c-edm); color: var(--on-accent);
         transition: transform .15s, box-shadow .15s, background .15s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(31, 111, 224, .28); }
  .btn.ghost { background: transparent; color: var(--c-edm); }
  .btn.ghost:hover { background: var(--chip); box-shadow: none; }
  .btn[hidden] { display: none; }

  /* ---------- Quiz ---------- */
  .progress { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .opts { display: grid; gap: 8px; margin: 14px 0; }
  .opt { text-align: left; font: inherit; padding: 10px 12px; cursor: pointer; color: var(--text);
         background: var(--surface); border: 1px solid var(--border); border-radius: 10px; transition: border-color .15s, transform .15s; }
  .opt:hover:not(:disabled) { border-color: var(--c-edm); transform: translateX(2px); }
  .opt:disabled { cursor: default; }
  .opt code { background: none; padding: 0; }
  .opt.good, .feedback.good { border-color: var(--good); background: var(--good-bg); }
  .opt.bad, .feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
  .feedback { margin: 14px 0 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); }
  .node.good { animation: pop .45s ease; filter: drop-shadow(0 0 8px var(--good)); }
  .node.good .card-bg { stroke: var(--good); stroke-width: 3; fill: var(--good-bg); }
  .node.bad { animation: shake .4s ease; }
  .node.bad .card-bg { stroke: var(--bad); stroke-width: 3; fill: var(--bad-bg); }
  @keyframes pop { 40% { transform: scale(1.08); } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  /* hide table names during the quiz: they would give away answers */
  svg.quiz .edge .tbl { display: none; }
  svg.quiz .edge .qmark { display: block; }
  svg.quiz .edge.reveal .tbl { display: block; }
  svg.quiz .edge.reveal .qmark { display: none; }
  .panel.big { font-size: 20px; }
  .panel.big h2 { font-size: 28px; line-height: 1.3; }
  .panel.big .hint, .panel.big .progress { font-size: 16px; }

  /* ---------- Full screen / presentation ---------- */
  body.present header, body.present main { max-width: none; }
  body.present .sub, body.present .back { display: none; }
  body.present main { grid-template-columns: minmax(0, 1fr) 460px; }
  body.present svg { height: calc(100vh - 150px); }      /* whole map visible, no scrolling */
  body.present .panel { font-size: 17px; max-height: calc(100vh - 150px); overflow: auto; }
  body.present .panel h2 { font-size: 26px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../">← Lernprojekte</a>
  <div class="title">
    <svg class="mark" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12h8l4-9 6 18 5-13 3 4h10"/></svg>
    <h1>IS-U Objektkarte</h1>
  </div>
  <p class="sub">Wie hängen Geschäftspartner, Anlage, Gerät, Zählwerk und Profil zusammen? Klicke auf ein Objekt oder eine Verbindung.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Tabelle oder Transaktion suchen, z. B. EASTS, EG34, EPROFASS">
    <button class="btn" id="quizBtn">Quiz starten</button>
    <button class="btn ghost" id="audBtn">Publikumsquiz</button>
    <button class="btn ghost" id="fullBtn" title="Taste F">Vollbild</button>
    <button class="btn ghost" id="themeBtn">Dunkel</button>
    <div class="legend">
      <button class="chip" data-cat="sales" style="--dot: var(--c-sales)">Kaufmännisch</button>
      <button class="chip" data-cat="place" style="--dot: var(--c-place)">Ort &amp; Anlage</button>
      <button class="chip" data-cat="device" style="--dot: var(--c-device)">Gerät &amp; Messung</button>
      <button class="chip" data-cat="edm" style="--dot: var(--c-edm)">EDM</button>
      <button class="chip" data-cat="market" style="--dot: var(--c-market)">Markt</button>
      <span class="badge" id="chkLegend">⚠ gestrichelt = noch prüfen</span>
    </div>
  </div>
</header>

<main>
  <div class="card map"><svg id="map" viewBox="0 0 1180 940" role="img" aria-label="IS-U Objektmodell"></svg></div>
  <aside class="card panel" id="panel" aria-live="polite"></aside>
</main>

<script>
/* =====================================================================
   DATA
   src: 'ref' = checked in the system, 'chk' = still to be checked
        ('chk' gets a ⚠ badge in the panel and a dashed arrow on the map)
   Layout grid: x = 40 / 340 / 640 / 940, y = 60 / 220 / 380 / 540 / 700 / 860
   ===================================================================== */
const NODES = [
  { id: 'gp', name: 'Geschäftspartner', en: 'Business Partner', cat: 'sales', x: 40, y: 220,
    desc: 'Person oder Organisation, mit der das Unternehmen eine Geschäftsbeziehung hat, z. B. der Kunde. Der GP ist SAP-weit zentral und nicht IS-U-spezifisch.',
    tables: [['BUT000', 'Allgemeine GP-Daten', 'ref'], ['TB004T', 'Texte zur GP-Art', 'ref'],
             ['BCONT', 'Kundenkontakte zum GP', 'ref']],
    tcodes: [['BP', 'GP anlegen / ändern / anzeigen', 'ref']],
    notes: ['BUT000-TYPE: 1 = Person, 2 = Organisation, 3 = Gruppe.',
            'Änderungsbelege (CDHDR) laufen unter der Objektklasse BUPA_BUP.'] },

  { id: 'vk', name: 'Vertragskonto', en: 'Contract Account', cat: 'sales', x: 40, y: 380,
    desc: 'Konto im Vertragskontokorrent (FI-CA). Hier landen Forderungen und Zahlungen eines Geschäftspartners. Ein Vertragskonto kann mehrere Verträge bündeln und steuert z. B. Zahlung und Mahnung.',
    tables: [['FKKVK', 'Kopfdaten', 'ref'], ['FKKVKP', 'GP-abhängige Daten', 'ref']],
    tcodes: [['CAA1 / CAA2 / CAA3', 'anlegen / ändern / anzeigen', 'ref']],
    notes: ['Inhaber ist FKKVKP-GPART. Weitere GP können beteiligt sein: abweichender Zahler (ABWRE), abweichender Zahlungsempfänger (ABWRA), abweichender Mahnempfänger (ABWMA), abweichender Rechnungsempfänger (ABWRH).',
            'Zahlungssteuerung in FKKVKP: Zahlwege (EZAWE / AZAWE), Bankverbindungs-IDs (EBVTY / ABVTY), SEPA-Mandat (MNDID), Mahnverfahren (MAHNV).'] },

  { id: 'vertrag', name: 'Vertrag', en: 'Contract', cat: 'sales', x: 40, y: 540,
    desc: 'Die Brücke zwischen kaufmännischer und technischer Welt: Ein Vertrag gehört zu einem Vertragskonto und zu einer Anlage. Auf seiner Basis wird abgerechnet.',
    tables: [['EVER', 'Vertragsdaten', 'ref']],
    tcodes: [['ES20 / ES21 / ES22', 'anlegen / ändern / anzeigen', 'ref']],
    notes: ['EVER-VKONTO verweist auf das Vertragskonto, EINZDAT / AUSZDAT sind Ein- und Auszugsdatum.'] },

  { id: 'ao', name: 'Anschlussobjekt', en: 'Connection Object', cat: 'place', x: 340, y: 220,
    desc: 'Gebäude oder Grundstück mit Netzanschluss. Technisch ein Funktionsplatz aus der Instandhaltung (PM).',
    tables: [['IFLOT', 'Funktionsplatz', 'ref'], ['EHAUISU', 'IS-U-Daten zum Anschlussobjekt', 'ref']],
    tcodes: [['ES55 – ES57', 'Anschlussobjekt bearbeiten', 'ref']] },

  { id: 'vs', name: 'Verbrauchsstelle', en: 'Premise', cat: 'place', x: 340, y: 380,
    desc: 'Ort innerhalb eines Anschlussobjekts, an dem Energie verbraucht wird, z. B. eine Wohnung oder ein Laden.',
    tables: [['EVBS', 'Verbrauchsstelle', 'ref']],
    tcodes: [['ES60 – ES62', 'Verbrauchsstelle bearbeiten', 'ref']] },

  { id: 'anlage', name: 'Anlage', en: 'Installation', cat: 'place', x: 340, y: 540,
    desc: 'Fasst alles zusammen, was in einer Sparte an einer Verbrauchsstelle gemeinsam abgerechnet wird: eingebaute Geräte und Zählwerke, Tariftyp, Ableseeinheit, Lastprofile. Zeitabhängig über Zeitscheiben.',
    tables: [['EANL', 'Anlage (Sparte, Verbrauchsstelle)', 'ref'], ['EANLH', 'Zeitscheiben (Tariftyp, Ableseeinheit)', 'ref']],
    tcodes: [['ES30 / ES31 / ES32', 'anlegen / ändern / anzeigen', 'ref']],
    notes: ['ES31 → „Abgrenzen“ teilt die Zeitscheibe der Anlage (z. B. Tarifwechsel). Lastprofile grenzt man dagegen über den Button „Lastprofil“ ab.',
            'Je nach Marktrollen-Modell gehören mehrere Anlagen zu einer Marktlokation, z. B. eine für die Lieferung und eine für den Messstellenbetrieb. Das Gerät ist dann in beiden eingebaut.'] },

  { id: 'zp', name: 'Zählpunkt', en: 'Point of Delivery', cat: 'place', x: 340, y: 700,
    desc: 'Punkt, an dem Energie gemessen oder übergeben wird, mit externer ID. Im deutschen Markt werden darüber Marktlokation (MaLo) und Messlokation (MeLo) abgebildet.',
    tables: [['EUITRANS', 'Externe Zählpunkt-ID ↔ interne Nummer', 'ref'], ['EUIINSTLN', 'Zählpunkt ↔ Anlage', 'ref']],
    tcodes: [['EEDM09 / EEDM10 / EEDM11', 'Zählpunkt bearbeiten', 'ref']],
    notes: ['Weg von der Anlage zur externen ID: EANL → EUIINSTLN (über ANLAGE, zeitabhängig) → EUITRANS (über INT_UI) → EXT_UI.',
            'MaLo-ID: 11 Stellen, die letzte ist eine Prüfziffer. MeLo-ID: 33 Zeichen, beginnt mit „DE“.',
            'MaLo und MeLo sind beide Zählpunkte. Je nach Modell hängen sie an getrennten Anlagen, z. B. Lieferung und Messstellenbetrieb (siehe Anlage).'] },

  { id: 'gtyp', name: 'Gerätetyp', en: 'Device Category', cat: 'device', x: 940, y: 220,
    desc: 'Bauart eines Geräts, technisch ein Material. Legt u. a. Funktionsklasse, Messart und die Default-Zählwerksgruppe fest – und ob nur Geräteinfosätze erlaubt sind.',
    tables: [['ETYP', 'Schlüssel MATNR. BAUFORM, BAUKLAS, FUNKLAS, ZWGRUPPE, Beglaubigungsdaten, „Art anzul. Geräte“ (3 = nur Geräteinfosätze)', 'ref']],
    tcodes: [['EG01 / EG02 / EG03', 'anlegen / ändern / anzeigen', 'ref']] },

  { id: 'zwg', name: 'Zählwerksgruppe', en: 'Register Group', cat: 'device', x: 940, y: 380,
    desc: 'Vorlage für die Zählwerke eines Geräts: welche Zählwerke es gibt, mit OBIS-Kennzahl, Einheit und Intervall.',
    tables: [['EZWG', 'Zählwerke der Gruppe inkl. OBIS und Vorschlag', 'ref']],
    tcodes: [['EG04 / EG05 / EG06', 'anlegen (mit Vorlage) / ändern / anzeigen', 'ref']],
    notes: ['Beim Anlegen eines Geräteinfosatzes werden nur Zählwerke mit Haken „ZW bei E/W vorschl.“ übernommen.',
            'Einheit und Intervall eines Zählwerks kommen immer aus der Gruppe.',
            'EZWG_HEADD ist nur eine Dialogstruktur – nicht in SE16N. Die echte Tabelle findet man per SQL-Trace (ST05).'] },

const W = 204, H = 60;   // node size in SVG units

const CAT_LABEL = { sales: 'Kaufmännisch', place: 'Ort & Anlage', device: 'Gerät & Messung', edm: 'EDM', market: 'Markt' };

  sales:  'M7 3h7l4 4v14H7z M14 3v4h4 M10 12h5 M10 16h5',                                   // document
  place:  'M4 11l8-7 8 7 M6 10v10h12V10 M10 20v-5h4v5',                                      // house

/* =====================================================================
   DRAWING
   ===================================================================== */
const svg = document.getElementById('map');
const panel = document.getElementById('panel');
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}

// Point where the line from the box center towards (tx, ty) leaves the box.
function borderPoint(n, tx, ty) {
  const cx = n.x + W / 2, cy = n.y + H / 2, dx = tx - cx, dy = ty - cy;
  const t = Math.min((W / 2 + 5) / Math.abs(dx || 1e-9), (H / 2 + 5) / Math.abs(dy || 1e-9));
  return [cx + dx * t, cy + dy * t];
}

// One arrow head per category, so it matches the colour at the end of the connection
const defs = el('defs');
Object.keys(CAT_LABEL).forEach(cat => {
  const m = el('marker', { id: `arrow-${cat}`, viewBox: '0 0 10 10', refX: 8.5, refY: 5,
                           markerUnits: 'userSpaceOnUse', markerWidth: 11, markerHeight: 11, orient: 'auto' }, defs);
  el('path', { d: 'M0,1 L9,5 L0,9 z', style: `fill: var(--c-${cat})` }, m);
});

// Connections first, so nodes are drawn on top
EDGES.forEach((e, i) => {
  const a = byId[e.from], b = byId[e.to];
  const [x1, y1] = borderPoint(a, b.x + W / 2, b.y + H / 2);
  const [x2, y2] = borderPoint(b, a.x + W / 2, a.y + H / 2);
  const d = `M${x1},${y1} L${x2},${y2}`;

  // the colour blends from the source category into the target category
  const grad = el('linearGradient', { id: `wire-${i}`, gradientUnits: 'userSpaceOnUse', x1, y1, x2, y2 }, defs);
  el('stop', { offset: 0, style: `stop-color: var(--c-${a.cat})` }, grad);
  el('stop', { offset: 1, style: `stop-color: var(--c-${b.cat})` }, grad);

  const g = el('g', { class: `edge ${e.src}`, 'data-i': i, style: `--i: ${i}` });
  el('path', { class: 'wire', d, stroke: `url(#wire-${i})`, 'marker-end': `url(#arrow-${b.cat})` }, g);
  el('path', { class: 'flow', d }, g);      // moving dots, visible only while the connection is active
  el('path', { class: 'hitarea', d }, g);   // wide invisible stroke: easier to hit with the mouse

  // Label (middle by default): the table as a pill, the relation appears on hover / selection
  const mx = x1 + (x2 - x1) * e.at, my = y1 + (y2 - y1) * e.at;
  // pill width from the character count (monospace), not from measuring the rendered text:
  // a measurement at load time is wrong when the page loads in a small or hidden window
  const pw = e.table.length * 6.4 + 14;
  el('rect', { class: 'pill', rx: 9, x: mx - pw / 2, y: my - 9, width: pw, height: 18 }, g);
  el('text', { class: 'tbl', x: mx, y: my + 3.5, 'text-anchor': 'middle' }, g).textContent = e.table;
  el('text', { class: 'qmark', x: mx, y: my + 4, 'text-anchor': 'middle' }, g).textContent = '?';
  el('text', { class: 'verb', x: mx, y: my - 14, 'text-anchor': 'middle' }, g).textContent = e.label;

  g.addEventListener('click', () => { if (!quiz.on) selectEdge(i); });
  e.g = g;
});

// Nodes appear one after the other, top-left to bottom-right
const drawOrder = [...NODES].sort((p, q) => p.y - q.y || p.x - q.x);

NODES.forEach(n => {
  const g = el('g', { class: 'node', tabindex: 0, role: 'button', 'aria-label': n.name,
                      style: `--cat: var(--c-${n.cat}); --i: ${drawOrder.indexOf(n)}` });
  el('rect', { class: 'card-bg', x: n.x, y: n.y, width: W, height: H, rx: 14 }, g);
  el('circle', { class: 'badge-bg', cx: n.x + 30, cy: n.y + H / 2, r: 17 }, g);
  el('path', { class: 'icon', d: ICON[n.cat], transform: `translate(${n.x + 18} ${n.y + H / 2 - 12})` }, g);
  el('text', { class: 'name', x: n.x + 56, y: n.y + 27 }, g).textContent = n.name;
  el('text', { class: 'en', x: n.x + 56, y: n.y + 44 }, g).textContent = n.en;
  const pick = () => quiz.on ? answerOnMap(n.id) : selectNode(n.id);
  g.addEventListener('click', pick);
  g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); pick(); } });
  n.g = g;
});

/* =====================================================================
   SELECTION + PANEL
   ===================================================================== */
function highlight(nodeIds, edgeIdx) {
  NODES.forEach(n => n.g.classList.toggle('dim', !nodeIds.has(n.id)));
  EDGES.forEach((e, i) => {
    e.g.classList.toggle('dim', !edgeIdx.has(i));
    e.g.classList.toggle('on', edgeIdx.has(i));
  });
}

function rows(list) {
  return list.map(([name, text, src]) =>
    `<div class="row"><span class="k"><code>${name}</code></span><span>${text}</span>${src === 'chk' ? '<span class="badge">⚠ prüfen</span>' : ''}</div>`).join('');
}

function selectNode(id) {
  setCatFilter(null);
  const n = byId[id];
  const edgeIdx = new Set(), nodeIds = new Set([id]);
  EDGES.forEach((e, i) => {
    if (e.from === id || e.to === id) { edgeIdx.add(i); nodeIds.add(e.from); nodeIds.add(e.to); }
  });
  NODES.forEach(x => x.g.classList.toggle('sel', x.id === id));
  highlight(nodeIds, edgeIdx);

  const rels = [...edgeIdx].map(i => {
    const e = EDGES[i], out = e.from === id, other = byId[out ? e.to : e.from];
    return `<button class="rel" data-node="${other.id}">${out ? '→' : '←'} <b>${other.name}</b>: ${e.label} · <code>${e.table}</code></button>`;
  }).join('');

  panel.innerHTML = `
    <div class="cat-chip" style="--cat: var(--c-${n.cat})">${CAT_LABEL[n.cat]}</div>
    <h2>${n.name}</h2><div class="en-label">${n.en}</div>
    <p>${n.desc}</p>
    ${n.tables.length ? `<h3>Tabellen</h3>${rows(n.tables)}` : ''}
    ${n.tcodes.length ? `<h3>Transaktionen</h3>${rows(n.tcodes)}` : ''}
    ${n.notes ? `<h3>Merke</h3><ul>${n.notes.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
    <h3>Beziehungen</h3>${rels}
    ${linkBox()}
    <p class="hint" style="margin-top:14px">Esc oder Klick auf freie Fläche: Auswahl aufheben</p>`;
  panel.querySelectorAll('.rel').forEach(b => b.addEventListener('click', () => selectNode(b.dataset.node)));
  setHash(id);
}

function selectEdge(i) {
  setCatFilter(null);
  const e = EDGES[i], a = byId[e.from], b = byId[e.to];
  NODES.forEach(x => x.g.classList.remove('sel'));
  highlight(new Set([a.id, b.id]), new Set([i]));
  panel.innerHTML = `
    <h2>${a.name} → ${b.name}</h2>
    <p>Beziehung: <b>${e.label}</b></p>
    <h3>Gespeichert in</h3>${rows([[e.table, '', e.src]])}
    <h3>Weiter zu</h3>
    <button class="rel" data-node="${a.id}">${a.name}</button>
    <button class="rel" data-node="${b.id}">${b.name}</button>
    ${linkBox()}`;
  panel.querySelectorAll('.rel').forEach(btn => btn.addEventListener('click', () => selectNode(btn.dataset.node)));
  setHash(`${a.id}-${b.id}`);
}

function reset() {
  setCatFilter(null);
  NODES.forEach(n => n.g.classList.remove('sel', 'dim'));
  EDGES.forEach(e => e.g.classList.remove('dim', 'on'));
  panel.innerHTML = `
    <h2>Willkommen</h2>
    <p>Diese Karte zeigt die wichtigsten IS-U-Objekte und wie sie zusammenhängen – von der kaufmännischen Seite (links) über Ort und Anlage bis zu Gerät, Zählwerk und EDM-Profil.</p>
    <h3>So geht's</h3>
    <ul>
      <li>Klick auf ein <b>Objekt</b>: Beschreibung, Tabellen, Transaktionen, Beziehungen.</li>
      <li>Klick auf eine <b>Verbindung</b>: in welcher Tabelle sie gespeichert ist.</li>
      <li><b>Suche</b> oben: Tabelle oder Transaktion eintippen, z. B. <code>EASTS</code> oder <code>EG34</code>.</li>
      <li><b>Quiz</b>: 10 Fragen, automatisch erzeugt aus den Daten dieser Karte. Das <b>Publikumsquiz</b> ist für Präsentationen: Leertaste löst auf.</li>
      <li><b>Direktlinks</b>: Jedes Objekt hat eine eigene Adresse, z. B. <code>#anlage</code>, eine Verbindung z. B. <code>#anlage-zw</code>. <code>#quiz</code> und <code>#publikumsquiz</code> starten direkt das Quiz.</li>
      <li><b>Vollbild</b> für Präsentationen: Button oben oder Taste <code>F</code>.</li>
      <li><b>Bereiche</b>: Klick auf einen Bereich oben (z. B. „Gerät &amp; Messung“) hebt nur diesen Teil der Karte hervor.</li>
    </ul>`;
  setHash('');
}

/* =====================================================================
   DIRECT LINKS: the URL hash mirrors what is shown
     #anlage          → object
     #anlage-zw       → connection (from-to)
     #quiz            → quiz, #publikumsquiz → audience quiz
   ===================================================================== */
function setHash(h) {
  // replaceState: no new history entry per click, and no hashchange event
  try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* e.g. preview without real URL */ }
}

function applyHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  const edge = EDGES.findIndex(e => `${e.from}-${e.to}` === h);
  if (quiz.on && h !== 'quiz' && h !== 'publikumsquiz') stopQuiz();
  if (byId[h]) selectNode(h);
  else if (edge >= 0) selectEdge(edge);
  else if (h === 'quiz' || h === 'publikumsquiz') startQuiz(h === 'publikumsquiz');
  else reset();
}

function linkBox() {
  return `<p style="margin-top:14px"><button class="btn ghost" id="copyLink">Link kopieren</button>
          <span class="hint" id="copyMsg"></span></p>`;
}

// Delegated, because the button is re-created with every panel update
panel.addEventListener('click', async ev => {
  if (ev.target.id !== 'copyLink') return;
  const msg = document.getElementById('copyMsg');
  try {
    await navigator.clipboard.writeText(location.href);
    msg.textContent = 'Kopiert!';
  } catch (e) {
    msg.textContent = location.href;   // clipboard blocked: show it for manual copying
  }
});

window.addEventListener('hashchange', applyHash);

/* =====================================================================
   CATEGORY FILTER: a click on a legend chip highlights one part of the map
   ===================================================================== */
const chips = document.querySelectorAll('.chip[data-cat]');

function setCatFilter(cat) {
  chips.forEach(c => c.classList.toggle('on', c.dataset.cat === cat));
}

chips.forEach(c => c.addEventListener('click', () => {
  if (quiz.on) return;
  const cat = c.classList.contains('on') ? null : c.dataset.cat;
  reset();
  if (!cat) return;
  setCatFilter(cat);
  const ids = new Set(NODES.filter(n => n.cat === cat).map(n => n.id));
  const inside = new Set(EDGES.map((e, i) => ids.has(e.from) && ids.has(e.to) ? i : -1).filter(i => i >= 0));
  highlight(ids, inside);
  panel.innerHTML = `
    <div class="cat-chip" style="--cat: var(--c-${cat})">${CAT_LABEL[cat]}</div>
    <h2>${ids.size} Objekte</h2>
    <p class="hint">Klicke eines an – oder noch einmal auf den Bereich, um die ganze Karte zu sehen.</p>
    ${NODES.filter(n => n.cat === cat).map(n => `<button class="rel" data-node="${n.id}"><b>${n.name}</b> · ${n.en}</button>`).join('')}`;
  panel.querySelectorAll('.rel').forEach(b => b.addEventListener('click', () => selectNode(b.dataset.node)));
}));

/* =====================================================================
   THEME: follows the system setting, the button switches by hand
   ===================================================================== */
const themeBtn = document.getElementById('themeBtn');
const THEME_KEY = 'isu-objektkarte-theme';

function currentTheme() {
  return document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === 'dark' ? 'Hell' : 'Dunkel';
}

try { const saved = localStorage.getItem(THEME_KEY); if (saved) setTheme(saved); } catch (e) { /* storage blocked */ }
themeBtn.textContent = currentTheme() === 'dark' ? 'Hell' : 'Dunkel';
themeBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  setTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* storage blocked */ }
});

/* =====================================================================
   FULL SCREEN: browser full screen plus a layout where the whole map fits.
   If the browser refuses full screen, the layout still switches.
   ===================================================================== */
const fullBtn = document.getElementById('fullBtn');

function setPresent(on) {
  document.body.classList.toggle('present', on);
  fullBtn.textContent = on ? 'Vollbild beenden' : 'Vollbild';
}

function togglePresent() {
  const on = !document.body.classList.contains('present');
  setPresent(on);
  if (on) document.documentElement.requestFullscreen?.().catch(() => {});
  else if (document.fullscreenElement) document.exitFullscreen();
}

fullBtn.addEventListener('click', togglePresent);
// Esc in browser full screen only ends full screen – follow that
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) setPresent(false); });
document.addEventListener('keydown', ev => {
  if ((ev.key === 'f' || ev.key === 'F') && !ev.ctrlKey && !ev.metaKey && !ev.altKey && ev.target.tagName !== 'INPUT') togglePresent();
});

svg.addEventListener('click', ev => { if (ev.target === svg && !quiz.on) reset(); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (quiz.on) stopQuiz(); else { search.value = ''; runSearch(); reset(); }
});

/* =====================================================================
   SEARCH: matches names, tables and transactions of nodes and edges
   ===================================================================== */
const search = document.getElementById('search');

function runSearch() {
  const q = search.value.trim().toUpperCase();
  const hits = new Set();
  if (q) {
    NODES.forEach(n => {
      const text = [n.name, n.en, ...n.tables.flat(), ...n.tcodes.flat()].join(' ').toUpperCase();
      if (text.includes(q)) hits.add(n.id);
    });
    EDGES.forEach(e => { if (e.table.toUpperCase().includes(q)) { hits.add(e.from); hits.add(e.to); } });
  }
  NODES.forEach(n => n.g.classList.toggle('hit', hits.has(n.id)));
  return hits;
}

search.addEventListener('input', runSearch);
search.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const first = [...runSearch()][0]; if (first) selectNode(first); }
});

/* =====================================================================
   QUIZ: all questions are generated from NODES and EDGES,
   so new objects show up in the quiz automatically.
   Three question types:
     where  – "Which object does table X belong to?" → click on the map
     choice – "Which table connects A and B?" → 4 options
     choice – "Which transaction creates / changes / displays X?" → 4 options
   ===================================================================== */
const QUIZ_LEN = 10;
const BEST_KEY = 'isu-objektkarte-quiz-best';
const CODE = /^[A-Z0-9_]+$/;
const quizBtn = document.getElementById('quizBtn');
const audBtn = document.getElementById('audBtn');
const quiz = { on: false, audience: false, done: false, answered: false, qs: [], i: 0, score: 0, missed: [] };

// 'ES55 – ES57' → ['ES55', 'ES57']
const tokens = s => s.split(/[\s\/,–]+/).filter(t => CODE.test(t) && t.length >= 2);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Correct answer plus 3 wrong ones. Similar names (same prefix, e.g. EASTL for EASTS) are preferred.
function withDistractors(correct, pool) {
  const prefix = s => { let k = 0; while (k < s.length && s[k] === correct[k]) k++; return k; };
  const similar = shuffle(pool.filter(t => t !== correct)).sort((x, y) => prefix(y) - prefix(x));
  return shuffle([correct, ...shuffle(similar.slice(0, 6)).slice(0, 3)]);
}

function buildQuestions() {
  const owners = {};   // token → ids of all objects that list it
  NODES.forEach(n => [...n.tables, ...n.tcodes].forEach(([name]) =>
    tokens(name).forEach(t => (owners[t] ??= new Set()).add(n.id))));
  const tablePool = [...new Set([...NODES.flatMap(n => n.tables.flatMap(([name]) => tokens(name))),
                                 ...EDGES.flatMap(e => tokens(e.table))])];
  const tcodePool = [...new Set(NODES.flatMap(n => n.tcodes.flatMap(([name]) => tokens(name))))];
  const qs = [];

  // where: only tables that belong to exactly one object, otherwise there would be several right answers
  // A link table (e.g. EUIGRID: Zählpunkt ↔ Netz) also counts for the object on the other end.
  NODES.forEach(n => n.tables.forEach(([name, text, src]) => {
    if (src !== 'ref' || !tokens(name).every(t => owners[t].size === 1)) return;
    const accept = new Set([n.id]);
    EDGES.forEach(e => {
      if ((e.from === n.id || e.to === n.id) && tokens(e.table).some(t => tokens(name).includes(t))) {
        accept.add(e.from); accept.add(e.to);
      }
    });
    const others = [...accept].filter(id => id !== n.id).map(id => `<b>${byId[id].name}</b>`);
    qs.push({ type: 'where', node: n.id, accept, ask: `Zu welchem Objekt gehört <code>${name}</code>?`,
              explain: `<code>${name}</code> gehört zu <b>${n.name}</b>: ${text}` +
                       (others.length ? `. Sie speichert auch die Verbindung zu ${others.join(', ')} – das zählt auch.` : '') });
  }));

  // choice: table of a connection
  EDGES.forEach((e, i) => {
    if (e.src !== 'ref' || !CODE.test(e.table)) return;
    const a = byId[e.from], b = byId[e.to];
    qs.push({ type: 'choice', edge: i, nodes: [a.id, b.id], answer: e.table,
              options: withDistractors(e.table, tablePool),
              ask: `Welche Tabelle verbindet <b>${a.name}</b> und <b>${b.name}</b>?`,
              explain: `${a.name} → ${b.name}: ${e.label} · <code>${e.table}</code>` });
  });

  // choice: transaction, from rows like ['EG44 / EG41 / EG43', 'Geräteinfosatz anlegen / ändern / anzeigen']
  NODES.forEach(n => n.tcodes.forEach(([name, text, src]) => {
    const codes = name.split(' / '), parts = text.split(' / ');
    if (src !== 'ref' || codes.length < 2 || codes.length !== parts.length || !codes.every(c => CODE.test(c))) return;
    const startsWithVerb = /^[a-zäöü]/.test(parts[0]);
    const subject = startsWithVerb ? n.name : parts[0].split(' ').slice(0, -1).join(' ');
    const verbs = [startsWithVerb ? parts[0] : parts[0].split(' ').at(-1), ...parts.slice(1)];
    codes.forEach((code, k) => qs.push({
      type: 'choice', nodes: [n.id], answer: code, options: withDistractors(code, tcodePool),
      ask: `Mit welcher Transaktion: <b>${subject} ${verbs[k]}</b>?`,
      explain: `<code>${code}</code>: ${subject} ${verbs[k]}` }));
  }));

  return qs;
}

function clearMarks() {
  setCatFilter(null);
  NODES.forEach(n => n.g.classList.remove('good', 'bad', 'sel', 'dim', 'hit'));
  EDGES.forEach(e => e.g.classList.remove('reveal', 'on', 'dim'));
}

function startQuiz(audience) {
  Object.assign(quiz, { on: true, audience, i: 0, score: 0, missed: [],
                        qs: shuffle(buildQuestions()).slice(0, QUIZ_LEN) });
  search.value = ''; search.disabled = true;
  document.body.classList.add('quizzing');
  svg.classList.add('quiz');
  panel.classList.toggle('big', audience);
  quizBtn.textContent = 'Quiz beenden';
  audBtn.hidden = true;
  setHash(audience ? 'publikumsquiz' : 'quiz');
  showQuestion();
}

function stopQuiz() {
  quiz.on = false;
  search.disabled = false;
  document.body.classList.remove('quizzing');
  svg.classList.remove('quiz');
  panel.classList.remove('big');
  quizBtn.textContent = 'Quiz starten';
  audBtn.hidden = false;
  clearMarks();
  reset();
}

function showQuestion() {
  const q = quiz.qs[quiz.i];
  quiz.answered = false; quiz.done = false;
  clearMarks();
  if (q.edge !== undefined) highlight(new Set(q.nodes), new Set([q.edge]));   // show which connection is meant

  const how = q.type === 'where'
    ? `<p class="hint ask-hint">${quiz.audience ? 'Leertaste: Auflösen' : 'Klicke auf der Karte auf das richtige Objekt.'}</p>`
    : `<div class="opts">${q.options.map(o => `<button class="opt" data-o="${o}"><code>${o}</code></button>`).join('')}</div>
       ${quiz.audience ? '<p class="hint ask-hint">Leertaste: Auflösen</p>' : ''}`;
  panel.innerHTML = `
    <div class="progress">Frage ${quiz.i + 1} / ${quiz.qs.length}${quiz.audience ? '' : ` · ${quiz.score} richtig`}</div>
    <h2>${q.ask}</h2>
    ${how}
    <div id="fb"></div>`;
  panel.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(b.dataset.o)));
}

function answerOnMap(id) {
  if (quiz.qs[quiz.i]?.type === 'where') answer(id);
}

// given = clicked object id or option; null = revealed without answer (audience mode)
function answer(given) {
  if (!quiz.on || quiz.answered || quiz.done) return;
  const q = quiz.qs[quiz.i];
  const correct = q.type === 'where' ? q.node : q.answer;
  const ok = q.type === 'where' ? q.accept.has(given) : given === correct;
  quiz.answered = true;
  if (!quiz.audience) { if (ok) quiz.score++; else quiz.missed.push(q); }

  if (q.type === 'where') {
    q.accept.forEach(id => byId[id].g.classList.add('good'));
    if (given && !ok) byId[given].g.classList.add('bad');
  } else {
    panel.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.o === correct) b.classList.add('good');
      else if (b.dataset.o === given) b.classList.add('bad');
    });
    if (q.edge !== undefined) EDGES[q.edge].g.classList.add('reveal');
    else { highlight(new Set(q.nodes), new Set()); byId[q.nodes[0]].g.classList.add('good'); }
  }

  panel.querySelector('.ask-hint')?.remove();
  const verdict = given === null ? '' : ok ? '✓ Richtig! ' : '✗ Leider falsch. ';
  const last = quiz.i === quiz.qs.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="feedback ${given === null ? '' : ok ? 'good' : 'bad'}">${verdict}${q.explain}</div>
    <button class="btn" id="next">${last ? 'Ergebnis' : 'Weiter'}</button>
    <span class="hint">oder ${quiz.audience ? 'Leertaste' : 'Enter'}</span>`;
  document.getElementById('next').addEventListener('click', next);
}

function next() {
  if (quiz.i < quiz.qs.length - 1) { quiz.i++; showQuestion(); } else showResult();
}

function showResult() {
  quiz.done = true;
  clearMarks();
  if (quiz.audience) {
    panel.innerHTML = `<h2>Geschafft!</h2><p>Danke fürs Mitraten.</p>
      <button class="btn" id="again">Neue Runde</button> <button class="btn ghost" id="end">Zur Karte</button>`;
  } else {
    let best = quiz.score;
    try {
      best = Math.max(Number(localStorage.getItem(BEST_KEY)) || 0, quiz.score);
      localStorage.setItem(BEST_KEY, best);
    } catch (e) { /* storage blocked: just show this round */ }
    panel.innerHTML = `
      <h2>${quiz.score} von ${quiz.qs.length} richtig</h2>
      <p class="hint">Bestwert in diesem Browser: ${best} / ${QUIZ_LEN}</p>
      ${quiz.missed.length
        ? `<h3>Zum Wiederholen</h3><ul>${quiz.missed.map(q => `<li>${q.explain}</li>`).join('')}</ul>`
        : '<p>Alles richtig – stark!</p>'}
      <button class="btn" id="again">Neue Runde</button> <button class="btn ghost" id="end">Zur Karte</button>`;
  }
  document.getElementById('again').addEventListener('click', () => startQuiz(quiz.audience));
  document.getElementById('end').addEventListener('click', stopQuiz);
}

quizBtn.addEventListener('click', () => quiz.on ? stopQuiz() : startQuiz(false));
audBtn.addEventListener('click', () => startQuiz(true));

// Enter / space: next question; in audience mode space also reveals the answer
document.addEventListener('keydown', ev => {
  if (!quiz.on || quiz.done || ev.target.tagName === 'BUTTON') return;
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  ev.preventDefault();
  if (quiz.answered) next();
  else if (quiz.audience) answer(null);
});

// The "dashed = still to check" legend only makes sense while a connection is unchecked
document.getElementById('chkLegend').hidden = !EDGES.some(e => e.src === 'chk');

applyHash();   // open what the link points to, otherwise the welcome text
</script>
</body>
</html>
